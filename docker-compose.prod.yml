# VPS deployment: app + Postgres + Caddy (automatic HTTPS).
# Usage: cp .env.example .env.production (fill it in), set DOMAIN, then:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-coolkick}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-coolkick}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coolkick}"]
      interval: 5s
      retries: 10

  app:
    build:
      context: .
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${NEXT_PUBLIC_WHATSAPP_NUMBER}
        NEXT_PUBLIC_SHOP_PHONE: ${NEXT_PUBLIC_SHOP_PHONE}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coolkick}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coolkick}?schema=public
      STORAGE_DRIVER: local
    volumes:
      - uploads:/app/uploads

  # One-off: migrations (+ seed on first install). Uses the full build stage (Prisma CLI, tsx).
  #   docker compose -f docker-compose.prod.yml --env-file .env.production run --rm migrate
  migrate:
    build:
      context: .
      target: build
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    profiles: ["tools"]
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-coolkick}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-coolkick}?schema=public
    command: sh -c "npx prisma migrate deploy && npm run db:seed"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    command: caddy reverse-proxy --from ${DOMAIN:?set DOMAIN} --to app:3000
    volumes:
      - caddy-data:/data
    depends_on:
      - app

volumes:
  db-data:
  uploads:
  caddy-data:
